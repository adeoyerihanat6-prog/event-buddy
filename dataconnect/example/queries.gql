mutation InsertUser {
  user_insert(data: {
    id_expr: "auth.uid",
    displayName: "New User",
    email: "user@example.com",
    bio: "Hello world"
  })
}

mutation UpdateUser($bio: String!) @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {bio: $bio})
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: {id_expr: "auth.uid"})
}

query GetMyUser @auth(level: USER) {
  user(key: {id_expr: "auth.uid"}) {
    displayName
    email
    bio
  }
}

query ListAllUsers @auth(level: PUBLIC, insecureReason: "Public directory of users") {
  users {
    displayName
    bio
  }
}

mutation CreateCategory($name: String!) @auth(level: USER) {
  interestCategory_insert(data: {name: $name})
}

mutation UpdateCategory($id: UUID!, $iconUrl: String!) @auth(level: USER) {
  interestCategory_update(id: $id, data: {iconUrl: $iconUrl})
}

mutation DeleteCategory($id: UUID!) @auth(level: USER) {
  interestCategory_delete(id: $id)
}

query GetCategory($id: UUID!) @auth(level: PUBLIC, insecureReason: "Categories are public") {
  interestCategory(id: $id) {
    name
    iconUrl
  }
}

query ListCategories @auth(level: PUBLIC, insecureReason: "Categories are public") {
  interestCategories {
    name
  }
}

mutation CreateEvent($data: Event_Data!) @auth(level: USER) {
  event_insert(data: $data)
}

mutation UpdateEvent($id: UUID!, $data: Event_Data!) @auth(level: USER) {
  event_update(id: $id, data: $data)
}

mutation DeleteEvent($id: UUID!) @auth(level: USER) {
  event_delete(id: $id)
}

query GetEvent($id: UUID!) @auth(level: PUBLIC, insecureReason: "Events are public") {
  event(id: $id) {
    title
    description
    organizer { displayName }
  }
}

query ListEvents @auth(level: PUBLIC, insecureReason: "Events are public") {
  events {
    title
    dateTime
    location
  }
}

mutation CreateRSVP($eventId: UUID!, $status: String!) @auth(level: USER) {
  rSVP_insert(data: {
    eventId: $eventId,
    userId_expr: "auth.uid",
    status: $status
  })
}

mutation UpdateRSVP($id: UUID!, $status: String!) @auth(level: USER) {
  rSVP_update(id: $id, data: {status: $status})
}

mutation DeleteRSVP($id: UUID!) @auth(level: USER) {
  rSVP_delete(id: $id)
}

query GetMyRSVPs @auth(level: USER) {
  rSVPS(where: {userId: {eq_expr: "auth.uid"}}) {
    event { title }
    status
  }
}

query ListEventRSVPs($eventId: UUID!) @auth(level: USER) {
  rSVPS(where: {eventId: {eq: $eventId}}) {
    user { displayName }
    status
  }
}

mutation CreateConnection($targetUserId: UUID!, $eventId: UUID!, $status: String!) @auth(level: USER) {
  connection_insert(data: {
    userAId_expr: "auth.uid",
    userBId: $targetUserId,
    sourceEventId: $eventId,
    status: $status
  })
}

mutation UpdateConnection($id: UUID!, $status: String!) @auth(level: USER) {
  connection_update(id: $id, data: {status: $status})
}

mutation DeleteConnection($id: UUID!) @auth(level: USER) {
  connection_delete(id: $id)
}

query GetMyConnections @auth(level: USER) {
  connections(where: {userAId: {eq_expr: "auth.uid"}}) {
    userB { displayName }
    status
  }
}

query ListEventConnections($eventId: UUID!) @auth(level: USER) {
  connections(where: {sourceEventId: {eq: $eventId}}) {
    userA { displayName }
    userB { displayName }
  }
}